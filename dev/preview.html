<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../icons/icon32.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot Renfe · vista previa</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2eef4; color: #241228; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 44px 32px; }
    .eyebrow { margin: 0 0 8px; color: #6b1f7c; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: 36px; letter-spacing: -1.3px; }
    .intro { margin: 12px 0 32px; color: #716177; max-width: 680px; }
    .galeria { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    article { min-width: 0; padding: 18px 16px 22px; background: #e8e0eb; border: 1px solid #ddd0e2; border-radius: 16px; }
    h2 { margin: 0 0 22px; font-size: 12px; font-weight: 650; color: #6b1f7c; }
    .slot { min-height: 278px; display: flex; align-items: flex-start; justify-content: center; }
    .slot > div { width: 100%; }
    footer { margin-top: 28px; color: #716177; font-size: 12px; }
    a { color: #6b1f7c; }
    #renfebot-panel { display: none; }
    @media (max-width: 900px) { .galeria { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .galeria { grid-template-columns: 1fr; } main { padding: 28px 20px; } }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Extensión de Chrome · Manifest V3</p>
  <h1>Bot Renfe</h1>
  <p class="intro">Marca los trenes que te valen. La extensión busca plaza, intenta formalizar tu viaje y te avisa del resultado.</p>
  <section class="galeria" id="escenas"></section>
  <footer>Interfaz real con datos de ejemplo. Esta página no se conecta a Renfe ni reserva billetes. <a href="popup.html">Ver el popup</a>.</footer>
</main>
<script type="module">
import { FASE, estadoInicial } from "../src/shared/state.js";

const VIGILADOS = { trenes: [
  { numtren: "09132", salida: "14.53" },
  { numtren: "09140", salida: "15.07" },
  { numtren: "12554", salida: "17.20" },
] };
const BUSCANDO = {
  fase: FASE.REFRESH, running: true, cycle: 37, lastCycleAt: Date.now() - 12000,
  ultimoDiagnostico: { enTabla: 18, vigilados: 3, vigiladosPresentes: 3, refresco: "onSelect" },
};
const CASOS = [
  ["01 / Elige tus trenes", { fase: FASE.IDLE }, VIGILADOS],
  ["02 / Buscando plaza", BUSCANDO, VIGILADOS],
  ["03 / Reserva completada", { fase: FASE.DONE, cycle: 38, lastCycleAt: Date.now(), result: { numtren: "09140" } },
    { trenes: [{ numtren: "09140", salida: "15.07" }] }],
  ["04 / Antes de empezar", { fase: FASE.IDLE }, { trenes: [] }],
  ["05 / Modo diagnóstico", { ...BUSCANDO, settings: { ...estadoInicial().settings, debug: true } }, VIGILADOS],
  ["06 / Verificación pendiente", { fase: FASE.PAUSED_CHALLENGE, lastError: "Renfe pide una verificacion. Resuelvela tu y reanuda." }, VIGILADOS],
];

for (const [i, [titulo, parcial, objetivo]] of CASOS.entries()) {
  const escena = document.createElement("article");
  const heading = document.createElement("h2");
  heading.textContent = titulo;
  const slot = document.createElement("div");
  slot.className = "slot";
  escena.append(heading, slot);
  document.getElementById("escenas").appendChild(escena);
  const modulo = await import(`../src/content/panel/panel.js?preview=${i}`);
  modulo.montarPanel({});
  const host = document.getElementById("renfebot-panel");
  host.style.display = "block";
  host.id = `preview-panel-${i}`;
  slot.appendChild(host);
  const panel = host.shadowRoot.querySelector(".panel");
  panel.style.position = "static";
  panel.style.width = "100%";
  modulo.actualizarPanel({ ...estadoInicial(), ...parcial }, objetivo);
}
</script>
</body>
</html>
