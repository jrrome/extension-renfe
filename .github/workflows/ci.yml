name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: bash -n empaquetar.sh
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: bot-renfe
          path: dist/*.zip
          if-no-files-found: error
